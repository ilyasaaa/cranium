<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cranium — оценка возраста по черепу · М. И. Самохина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  /* Anatomical Atlas palette — parchment & sepia ink */
  --bg:        oklch(0.91 0.030 80);   /* aged parchment */
  --bg-2:      oklch(0.88 0.035 75);   /* shaded paper */
  --bg-3:      oklch(0.84 0.040 70);   /* deeper shading */
  --line:      oklch(0.55 0.030 55);   /* hairline ink */
  --line-2:    oklch(0.35 0.040 50);   /* strong ink rule */
  --fg:        oklch(0.22 0.025 50);   /* dark sepia ink */
  --fg-dim:    oklch(0.38 0.030 55);   /* dim ink */
  --fg-mute:   oklch(0.52 0.025 60);   /* muted ink */
  --accent:    oklch(0.48 0.18 30);    /* rubric red — like initial caps in old books */
  --accent-dim: oklch(0.62 0.13 35);
  --danger:    oklch(0.45 0.21 28);    /* deep red */
  --ok:        oklch(0.42 0.10 140);   /* lichen / ink-green */

  /* score colors — light to inked */
  --s0: oklch(0.78 0.015 80);
  --s1: oklch(0.62 0.07 65);
  --s2: oklch(0.48 0.13 40);
  --s3: oklch(0.36 0.17 28);

  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans:  "Inter", system-ui, -apple-system, sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* parchment paper texture on body */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.18;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.13  0 0 0 0 0.08  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
/* subtle vignette / foxing in corners */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(ellipse at 0% 0%,   oklch(0.65 0.10 50 / 0.10), transparent 38%),
    radial-gradient(ellipse at 100% 0%, oklch(0.62 0.10 45 / 0.08), transparent 35%),
    radial-gradient(ellipse at 0% 100%, oklch(0.58 0.12 40 / 0.09), transparent 40%),
    radial-gradient(ellipse at 100% 100%, oklch(0.55 0.13 40 / 0.10), transparent 42%);
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }

::selection { background: var(--accent); color: var(--bg); }

/* utility */
.serif { font-family: var(--serif); font-weight: 400; }
.sans  { font-family: var(--sans); }
.mono  { font-family: var(--mono); }
.italic { font-style: italic; }
.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.divider {
  height: 1px;
  background: var(--line);
  border: 0;
}

/* nav */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 32px;
  background: linear-gradient(180deg, oklch(0.91 0.030 80) 60%, oklch(0.91 0.030 80 / 0));
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-dim);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--fg); }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.brand-mark { font-family: var(--serif); font-style: italic; font-size: 20px; letter-spacing: -0.01em; text-transform: none; color: var(--fg); }

.topbar-right { display: flex; align-items: center; gap: 24px; }
.lang-toggle { display: flex; gap: 2px; align-items: center; }
.lang-toggle button { padding: 4px 6px; color: var(--fg-mute); font: inherit; }
.lang-toggle button.on { color: var(--fg); }
.lang-toggle .sep { color: var(--line-2); }

.navlinks { display: flex; gap: 22px; }
.navlinks button { color: var(--fg-mute); padding: 4px 0; font: inherit; position: relative; white-space: nowrap; }
.navlinks button.on { color: var(--fg); }
.navlinks button.on::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
  height: 1px; background: var(--accent);
}

/* root */
#root { position: relative; z-index: 2; }

/* loading splash */
.splash {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  z-index: 100;
  font-family: var(--serif); font-style: italic; color: var(--fg-dim);
  font-size: 24px;
}

/* image slot styling — engraved frame */
image-slot {
  --is-bg: oklch(0.86 0.035 75);
  --is-border: var(--line);
  --is-fg: var(--fg-mute);
}

/* engraving — common hatching backgrounds */
.hatch-bg {
  background-image:
    repeating-linear-gradient(45deg,
      transparent 0px, transparent 5px,
      oklch(0.40 0.030 55 / 0.18) 5px, oklch(0.40 0.030 55 / 0.18) 5.5px);
}
.hatch-bg-dense {
  background-image:
    repeating-linear-gradient(60deg,
      transparent 0px, transparent 3px,
      oklch(0.40 0.030 55 / 0.28) 3px, oklch(0.40 0.030 55 / 0.28) 3.6px);
}
.dbl-border {
  box-shadow:
    inset 0 0 0 1px var(--line-2),
    inset 0 0 0 4px var(--bg),
    inset 0 0 0 5px var(--line);
}
</style>

<script type="application/json" id="speaker-notes">[]</script>
</head>
<body>

<div id="root">
  <div class="splash"><span>Cranium · загрузка</span></div>
</div>
